<svg xmlns="http://www.w3.org/2000/svg" width="900" height="920" viewBox="0 0 900 920" role="img" aria-labelledby="title desc">
  <title id="title">FOUR QUESTIONS. ONE WORLD.</title><desc id="desc">Four interconnected worldbuilding questions: Where does it happen? What conditions apply? Who lives with them? What changes because of them? They are optional prompts, not mandatory categories.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0F6FF"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D4ED8"/></marker>
  </defs>
  <rect width="900" height="920" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="918" rx="28" fill="none" stroke="#DBE4EF" stroke-width="2"/>
  <rect x="58" y="46" width="12" height="36" rx="6" fill="#1D4ED8"/>
  <text x="91" y="76" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="750" fill="#07111F">FOUR QUESTIONS. ONE WORLD.</text>
  <text x="60" y="119" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" fill="#64748B">You do not have to answer them all on day one.</text>
  <path d="M 450 342 C 450 368, 450 370, 450 395 M 450 537 C 450 564,450 566,450 590" stroke="#1D4ED8" opacity="0.65" stroke-width="4" fill="none" /><rect x="60" y="164" width="780" height="143" rx="21" fill="#EEF4FF" stroke="#D4E2F2" stroke-width="2"/><rect x="87" y="185" width="62" height="35" rx="17" fill="#EEF4FF"/><text x="118.0" y="210" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" fill="#1D4ED8" text-anchor="middle" >01</text><text x="176" y="214" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="750" fill="#1D4ED8" text-anchor="start" >WHERE?</text><text x="176" y="266" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="550" fill="#07111F" text-anchor="start" >A city built around memory archives.</text><path d="M 450 312 V 330" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)" /><rect x="60" y="335" width="780" height="143" rx="21" fill="#FFFFFF" stroke="#D4E2F2" stroke-width="2"/><rect x="87" y="356" width="62" height="35" rx="17" fill="#F6F8FB"/><text x="118.0" y="381" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" fill="#1D4ED8" text-anchor="middle" >02</text><text x="176" y="385" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="750" fill="#1D4ED8" text-anchor="start" >UNDER WHAT CONDITIONS?</text><text x="176" y="428" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="550" fill="#07111F" text-anchor="start" >A recording can be shared only</text><text x="176" y="459" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="550" fill="#07111F" text-anchor="start" >with consent.</text><path d="M 450 483 V 501" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)" /><rect x="60" y="506" width="780" height="143" rx="21" fill="#FFFFFF" stroke="#D4E2F2" stroke-width="2"/><rect x="87" y="527" width="62" height="35" rx="17" fill="#EEF4FF"/><text x="118.0" y="552" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" fill="#0891B2" text-anchor="middle" >03</text><text x="176" y="556" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="750" fill="#0891B2" text-anchor="start" >WHO IS AFFECTED?</text><text x="176" y="600" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="550" fill="#07111F" text-anchor="start" >Families, teachers, artisans</text><text x="176" y="631" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="550" fill="#07111F" text-anchor="start" >and mediators.</text><path d="M 450 654 V 672" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)" /><rect x="60" y="677" width="780" height="143" rx="21" fill="#E8F9FC" stroke="#D4E2F2" stroke-width="2"/><rect x="87" y="698" width="62" height="35" rx="17" fill="#F6F8FB"/><text x="118.0" y="723" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" fill="#0891B2" text-anchor="middle" >04</text><text x="176" y="727" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="750" fill="#0891B2" text-anchor="start" >WHAT CHANGES?</text><text x="176" y="771" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="550" fill="#07111F" text-anchor="start" >The rules affect what</text><text x="176" y="802" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="550" fill="#07111F" text-anchor="start" >schools may teach.</text><text x="450" y="884" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="550" fill="#64748B" text-anchor="middle" >These are lenses for exploration, not a checklist.</text></svg>