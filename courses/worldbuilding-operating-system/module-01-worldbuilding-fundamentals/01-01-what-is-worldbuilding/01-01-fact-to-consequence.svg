<svg xmlns="http://www.w3.org/2000/svg" width="900" height="976" viewBox="0 0 900 976" role="img" aria-labelledby="title desc">
  <title id="title">FROM FACT TO CONSEQUENCE</title><desc id="desc">Comparison of isolated note and connected question: A note says memory lanterns exist. A meaningful connection adds a consent rule and shows a teacher&#x27;s decision changing a class. This is a first glimpse of causal worldbuilding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0F6FF"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D4ED8"/></marker>
  </defs>
  <rect width="900" height="976" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="974" rx="28" fill="none" stroke="#DBE4EF" stroke-width="2"/>
  <rect x="58" y="46" width="12" height="36" rx="6" fill="#1D4ED8"/>
  <text x="91" y="76" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="750" fill="#07111F">FROM FACT TO CONSEQUENCE</text>
  <text x="60" y="119" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" fill="#64748B">A small relationship can make one detail matter.</text>
  <rect x="64" y="159" width="187" height="35" rx="17" fill="#F0F3F7"/><text x="157.5" y="184" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" fill="#64748B" text-anchor="middle" >ISOLATED NOTE</text><rect x="58" y="207" width="784" height="151" rx="23" fill="#FFFFFF" stroke="#DBE4EF" stroke-width="2"/><text x="90" y="263" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="33" font-weight="650" fill="#07111F" text-anchor="start" >“This city has memory lanterns.”</text><text x="90" y="321" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="450" fill="#64748B" text-anchor="start" >A promising creative seed, with no context yet.</text><text x="450" y="409" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1D4ED8" text-anchor="middle" >WHAT COULD IT CHANGE?</text><path d="M 450 435 V 481" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)" /><rect x="64" y="511" width="218" height="35" rx="17" fill="#EEF4FF"/><text x="173.0" y="536" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" fill="#1D4ED8" text-anchor="middle" >CONNECTED IDEA</text><rect x="58" y="559" width="784" height="255" rx="24" fill="#EEF4FF" stroke="#BBD0FF" stroke-width="2"/><text x="155" y="607" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="650" fill="#07111F" text-anchor="start" >Lanterns preserve memories.</text><text x="155" y="664" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="600" fill="#07111F" text-anchor="start" >Sharing requires consent.</text><text x="155" y="720" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="600" fill="#07111F" text-anchor="start" >A teacher changes the lesson plan.</text><path d="M 99 622 L 99 637 M 99 677 L 99 694" stroke="#0891B2" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="100" y="852" width="700" height="72" rx="17" fill="#E8F9FC" stroke="#B6E6F1" stroke-width="2"/><text x="450" y="898" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="720" fill="#0891B2" text-anchor="middle" >The rule gives an idea consequences.</text><text x="450" y="952" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="520" fill="#64748B" text-anchor="middle" >Ask what changes, not how much lore exists.</text></svg>