<svg xmlns="http://www.w3.org/2000/svg" width="900" height="912" viewBox="0 0 900 912" role="img" aria-labelledby="title desc">
  <title id="title">ONE IDEA. A WHOLE WORLD.</title><desc id="desc">Vertical flow: Seed: lanterns preserve memories. Rule: sharing requires consent. Choice: a teacher requests permission. Effect: school lessons may change. Worldbuilding connects ideas to conditions, choices, and effects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0F6FF"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D4ED8"/></marker>
  </defs>
  <rect width="900" height="912" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="910" rx="28" fill="none" stroke="#DBE4EF" stroke-width="2"/>
  <rect x="58" y="46" width="12" height="36" rx="6" fill="#1D4ED8"/>
  <text x="91" y="76" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="750" fill="#07111F">ONE IDEA. A WHOLE WORLD.</text>
  <text x="60" y="119" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" fill="#64748B">See how one imaginary detail changes everyday life.</text>
  <rect x="68" y="160" width="764" height="132" rx="22" fill="#FFFFFF" stroke="#DBE4EF" stroke-width="2"/><rect x="68" y="160" width="9" height="132" rx="4" fill="#1D4ED8"/><rect x="102" y="178" width="64" height="35" rx="17" fill="#EEF4FF"/><text x="134.0" y="203" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" fill="#1D4ED8" text-anchor="middle" >01</text><text x="192" y="202" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="750" fill="#1D4ED8" text-anchor="start" >THE IDEA</text><text x="192" y="241" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="550" fill="#07111F" text-anchor="start" >Lanterns can preserve</text><text x="192" y="273" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="550" fill="#07111F" text-anchor="start" >personal memories.</text><path d="M 450 297 V 326" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)" /><rect x="68" y="334" width="764" height="132" rx="22" fill="#EEF4FF" stroke="#B5CBEC" stroke-width="2"/><rect x="68" y="334" width="9" height="132" rx="4" fill="#1D4ED8"/><rect x="102" y="352" width="64" height="35" rx="17" fill="#FFFFFF"/><text x="134.0" y="377" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" fill="#1D4ED8" text-anchor="middle" >02</text><text x="192" y="376" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="750" fill="#1D4ED8" text-anchor="start" >A WORLD RULE</text><text x="192" y="415" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="550" fill="#07111F" text-anchor="start" >Sharing a memory</text><text x="192" y="447" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="550" fill="#07111F" text-anchor="start" >requires consent.</text><path d="M 450 471 V 500" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)" /><rect x="68" y="508" width="764" height="132" rx="22" fill="#FFFFFF" stroke="#DBE4EF" stroke-width="2"/><rect x="68" y="508" width="9" height="132" rx="4" fill="#0891B2"/><rect x="102" y="526" width="64" height="35" rx="17" fill="#EEF4FF"/><text x="134.0" y="551" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" fill="#0891B2" text-anchor="middle" >03</text><text x="192" y="550" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="750" fill="#0891B2" text-anchor="start" >A HUMAN CHOICE</text><text x="192" y="589" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="550" fill="#07111F" text-anchor="start" >A teacher asks before</text><text x="192" y="621" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="550" fill="#07111F" text-anchor="start" >using a recording.</text><path d="M 450 645 V 674" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#arrow)" /><rect x="68" y="682" width="764" height="132" rx="22" fill="#E8F9FC" stroke="#B5CBEC" stroke-width="2"/><rect x="68" y="682" width="9" height="132" rx="4" fill="#0891B2"/><rect x="102" y="700" width="64" height="35" rx="17" fill="#FFFFFF"/><text x="134.0" y="725" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="750" fill="#0891B2" text-anchor="middle" >04</text><text x="192" y="724" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="750" fill="#0891B2" text-anchor="start" >A CONSEQUENCE</text><text x="192" y="763" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="550" fill="#07111F" text-anchor="start" >Some lessons change;</text><text x="192" y="795" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="550" fill="#07111F" text-anchor="start" >new questions appear.</text><text x="450" y="882" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" fill="#1D4ED8" text-anchor="middle" >The world grows through meaningful connections.</text></svg>